name: Build Platform SDK

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        platform: [stm32f1, stm32f3, stm32f7]

    env:
      BUILD_NUMBER: ${{ github.run_number }}
      SDK_STANDALONE: ON

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install ARM toolchain and Ninja
        run: sudo apt update && sudo apt install -y gcc-arm-none-eabi ninja-build

      - name: Initialize target submodules
        run: ./scripts/init-submodules.sh --platform ${{ matrix.platform }}

      - name: Read SDK version
        id: sdkver
        run: |
          SDK_VER=$(cat VERSION)
          echo "SDK_VER=$SDK_VER" >> $GITHUB_ENV
          echo "Full SDK version: $SDK_VER+build.${{ github.run_number }}"

      - name: Configure SDK
        run: cmake --preset ${{ matrix.platform }}-release

      - name: Build SDK
        run: cmake --build --preset ${{ matrix.platform }}-release

      - name: Collect artifacts
        run: |
          mkdir -p artifacts/${{ matrix.platform }}
          find build/${{ matrix.platform }}-release -name "*.a" -exec cp {} artifacts/${{ matrix.platform }}/ \;

      - name: Upload SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: platform-sdk-${{ env.SDK_VER }}+build.${{ github.run_number }}-${{ matrix.platform }}
          path: artifacts/${{ matrix.platform }}
          retention-days: 7
