name: Host SDK CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  host:
    runs-on: ubuntu-latest

    env:
      BUILD_NUMBER: ${{ github.run_number }}
      SDK_STANDALONE: ON

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build g++

      - name: Read SDK version
        run: echo "SDK_VER=$(cat VERSION)" >> $GITHUB_ENV

      # --------------------
      # TEST BUILD
      # --------------------
      - name: Configure host (tests)
        run: |
          cmake -S . -B build-test \
            -G Ninja \
            -DPLATFORM=host \
            -DBUILD_TESTS=ON

      - name: Build host (tests)
        run: cmake --build build-test

      - name: Run tests
        run: ctest --test-dir build-test --output-on-failure

      # --------------------
      # RELEASE BUILD
      # --------------------
      - name: Configure host (release)
        run: |
          cmake -S . -B build-release \
            -G Ninja \
            -DPLATFORM=host \
            -DBUILD_TESTS=OFF

      - name: Build host (release)
        run: cmake --build build-release

      - name: Collect host artifacts
        run: |
          mkdir -p artifacts
          find build-release -name "*.a" -exec cp {} artifacts/ \;

      - name: Upload host SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: platform-sdk-${{ env.SDK_VER }}+build.${{ github.run_number }}-host
          path: artifacts
          retention-days: 7