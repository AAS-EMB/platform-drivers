name: Host SDK CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  host:
    runs-on: ubuntu-latest

    env:
      BUILD_NUMBER: ${{ github.run_number }}
      SDK_STANDALONE: ON

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build g++

      - name: Initialize test submodule
        run: ./scripts/init-submodules.sh --platform host --with-tests

      - name: Read SDK version
        run: echo "SDK_VER=$(cat VERSION)" >> $GITHUB_ENV

      # --------------------
      # TEST BUILD
      # --------------------
      - name: Configure host (tests)
        run: cmake --preset host-tests

      - name: Build host (tests)
        run: cmake --build --preset host-tests

      - name: Run tests
        run: ctest --preset host-tests

      # --------------------
      # RELEASE BUILD
      # --------------------
      - name: Configure host (release)
        run: cmake --preset host-release

      - name: Build host (release)
        run: cmake --build --preset host-release

      - name: Collect host artifacts
        run: |
          mkdir -p artifacts
          find build/host-release -name "*.a" -exec cp {} artifacts/ \;

      - name: Upload host SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: platform-sdk-${{ env.SDK_VER }}+build.${{ github.run_number }}-host
          path: artifacts
          retention-days: 7
